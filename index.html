<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Литературный вызов: 250 книг</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #e2e8f0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen pb-14 selection:bg-amber-200 selection:text-slate-900">

  <!-- Уведомление -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-slate-900 text-white font-medium px-3.5 py-2 rounded-xl shadow-lg text-xs">
    <span id="toast-text">Скопировано!</span>
  </div>

  <!-- Модальное окно импорта -->
  <div id="import-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-4 shadow-xl">
      <h3 class="text-base font-bold text-slate-900 mb-1">Загрузить чужой прогресс</h3>
      <p class="text-xs text-slate-500 mb-3">Вставьте ссылку или код прогресса друга:</p>
      <input id="import-input" type="text" placeholder="Ссылка или код..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-600 mb-3" />
      <div class="flex justify-end gap-2">
        <button onclick="closeImportModal()" class="px-3 py-1 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100">Отмена</button>
        <button onclick="applyImportCode()" class="px-3 py-1 rounded-lg text-xs font-semibold bg-amber-600 text-white hover:bg-amber-700">Применить</button>
      </div>
    </div>
  </div>

  <!-- Баннер чужого прогресса -->
  <div id="shared-banner" class="hidden bg-amber-50 border-b border-amber-200 px-3 py-1.5">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <span class="text-amber-900 text-[11px] font-medium">👀 Режим просмотра чужого списка.</span>
      <div class="flex items-center gap-1.5">
        <button onclick="acceptSharedProgress()" class="px-2 py-0.5 bg-amber-600 text-white font-semibold rounded text-[11px] hover:bg-amber-700">Сохранить себе</button>
        <button onclick="resetToOwnProgress()" class="px-2 py-0.5 bg-slate-200 text-slate-700 font-medium rounded text-[11px] hover:bg-slate-300">Вернуть мой</button>
      </div>
    </div>
  </div>

  <!-- Сверхкомпактная шапка (<20% экрана) -->
  <header class="border-b border-slate-200 bg-white/95 backdrop-blur sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 py-1.5">
      <!-- Строка 1: Заголовок + Прогресс + Кнопки -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <h1 class="serif-title text-sm sm:text-base font-bold text-slate-900 truncate">Канон: 250 книг</h1>
          <span id="reader-rank" class="font-semibold text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded text-[10px] truncate">Чистый лист</span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <div class="text-[11px] font-semibold text-slate-700">
            <span id="total-count" class="text-amber-600 font-bold">0</span>/<span id="total-max">250</span>
            <span id="total-percent" class="text-slate-400 text-[10px] ml-0.5">(0%)</span>
          </div>
          <div class="w-16 sm:w-28 h-1.5 bg-slate-200 rounded-full overflow-hidden hidden sm:block">
            <div id="total-bar" class="h-full bg-amber-600 transition-all duration-300" style="width: 0%"></div>
          </div>
          <button onclick="copyShareLink()" class="px-2 py-1 rounded bg-amber-600 hover:bg-amber-700 text-white font-semibold text-[11px]" title="Скопировать ссылку с прогрессом">🔗 Ссылка</button>
          <button onclick="exportTextSummary()" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-[11px] border border-slate-200" title="Скопировать текстовый отчет">📋</button>
          <button onclick="openImportModal()" class="px-1.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium text-[11px] border border-slate-200" title="Импорт кода">📥</button>
        </div>
      </div>

      <!-- Строка 2: Табы уровней + Быстрый фильтр -->
      <div class="mt-1.5 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
        <div id="tier-tabs" class="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-0.5"></div>
        <div class="flex items-center gap-1.5 shrink-0">
          <select id="status-filter" onchange="renderBooks()" class="bg-slate-50 border border-slate-200 rounded px-2 py-0.5 text-[11px] text-slate-700 focus:outline-none focus:border-amber-600">
            <option value="all">Все</option>
            <option value="unread">Не читал</option>
            <option value="read">Прочитано</option>
          </select>
          <input id="search-input" oninput="renderBooks()" type="text" placeholder="Поиск книги или автора..." class="w-full sm:w-44 bg-slate-50 border border-slate-200 rounded px-2 py-0.5 text-[11px] text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-600" />
        </div>
      </div>
    </div>
  </header>

  <!-- Компактная сетка книг -->
  <main class="max-w-6xl mx-auto px-3 mt-2.5">
    <div id="books-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2"></div>
  </main>

  <script>

      { id: 'x13', tier: 'Beast', title: 'На день грядущий (Against the Day)', author: 'Томас Пинчон', country: 'США', feature: '1100-страничный метароман о математике кватернионов и анархизме', rec: 'Т. Пинчон «Радуга тяготения»' },
      { id: 'x14', tier: 'Beast', title: 'Торжество Козла (Giles Goat-Boy)', author: 'Джон Барт', country: 'США', feature: '800-страничная университетская метафора холодной войны и мифа', rec: 'Дж. Барт «Торговец дурманом»' },
      { id: 'x15', tier: 'Beast', title: 'Туннель', author: 'Уильям Гасс', country: 'США', feature: '650 страниц мрачного барочного стиля и типографских игр' },
      { id: 'x16', tier: 'Beast', title: 'Bottom\'s Dream / На дне сновидений', author: 'Арно Шмидт', country: 'Германия', feature: 'Авангардная проза с фонетической орфографией и коллажами' },
      { id: 'x17', tier: 'Beast', title: 'Дом листьев', author: 'Марк З. Данилевски', country: 'США', feature: 'Эргодический роман-лабиринт с перевернутым и зеркальным текстом', rec: 'Х. Л. Борхес «Дом Астерия», В. Набоков «Бледный огонь»' },
      { id: 'x18', tier: 'Beast', title: 'Сатанинское танго / Меланхолия сопротивления', author: 'Ласло Краснахоркаи', country: 'Венгрия', feature: 'Гипнотические абзацы длиной в десятки страниц без точек' },
      { id: 'x19', tier: 'Beast', title: 'Благоволительницы', author: 'Джонатан Литтелл', country: 'Франция / США', feature: '900-страничный поток сознания нацистского офицера и миф об Оресте', rec: 'Эсхил «Орестея», Л. Толстой «Война и мир», В. Гроссман «Жизнь и судьба»' },
      { id: 'x20', tier: 'Beast', title: 'Locus Solus', author: 'Рэймонд Руссель', country: 'Франция', feature: 'Авангардный текст, построенный по скрытым фонетическим каламбурам' },
      { id: 'x21', tier: 'Beast', title: 'Анатомия меланхолии', author: 'Роберт Бёртон', country: 'Великобритания', feature: 'Барочный литературный лабиринт XVII века на 1500 страниц' },
      { id: 'x22', tier: 'Beast', title: 'Парадизо', author: 'Хосе Лесама Лима', country: 'Куба', feature: 'Герметичное необарокко с предельной концентрацией метафор', rec: 'Данте «Божественная комедия», М. Пруст' },
      { id: 'x23', tier: 'Beast', title: 'Махабхарата (в 18 книгах)', author: 'Вьяса (традиц.)', country: 'Древняя Индия', feature: 'Сверхмасштабный эпос (в 10 раз длиннее «Илиады» и «Одиссеи»)', rec: '«Бхагавадгита» (как отдельная глава)' },
      { id: 'x24', tier: 'Beast', title: 'Река без берегов (трилогия)', author: 'Ханс Хенни Янн', country: 'Германия', feature: '2000-страничный экспрессионистский монолит о музыке и распаде' },
      { id: 'x25', tier: 'Beast', title: 'Артамен, или Великий Кир', author: 'Мадлен и Жорж де Скюдери', country: 'Франция', feature: 'Рекордсмен европейской прозы: 10 томов и 13 000 страниц' }
    ];

    const STORAGE_KEY = 'lit_canon_200_v3';
    let state = {};
    let activeTier = 'ALL';
    let isViewingShared = false;

    function init() {
      document.getElementById('total-max').textContent = BOOKS.length;
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { state = JSON.parse(saved); } catch (e) { state = {}; }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const sharedCode = urlParams.get('p') || hashParams.get('p');

      if (sharedCode) {
        const decoded = decodeProgressCode(sharedCode);
        if (decoded) {
          state = decoded;
          isViewingShared = true;
          document.getElementById('shared-banner').classList.remove('hidden');
        }
      }

      renderTierTabs();
      updateDashboard();
      renderBooks();
    }

    function saveState() {
      if (isViewingShared) {
        isViewingShared = false;
        document.getElementById('shared-banner').classList.add('hidden');
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateUrlHashSilently();
      updateDashboard();
      renderTierTabs();
    }

    function encodeProgressCode() {
      const parts = [];
      BOOKS.forEach(b => {
        const item = state[b.id];
        if (item && item.read) {
          parts.push(item.rating ? `${b.id}.${item.rating}` : b.id);
        }
      });
      return parts.join('-');
    }

    function decodeProgressCode(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.trim();
      if (clean.includes('p=')) {
        const match = clean.match(/[?#&]p=([^&#\s]+)/);
        if (match && match[1]) clean = decodeURIComponent(match[1]);
      }
      const validIds = new Set(BOOKS.map(b => b.id));
      const newState = {};
      const tokens = clean.split(/[-,]/);
      let foundAny = false;

      tokens.forEach(tok => {
        const [id, ratingStr] = tok.trim().split('.');
        if (validIds.has(id)) {
          foundAny = true;
          const rating = parseInt(ratingStr, 10);
          newState[id] = {
            read: true,
            rating: (!isNaN(rating) && rating >= 1 && rating <= 5) ? rating : 0,
            note: '',
            showRec: false
          };
        }
      });
      return foundAny ? newState : null;
    }

    function updateUrlHashSilently() {
      const code = encodeProgressCode();
      try {
        if (code) {
          history.replaceState(null, '', `#p=${code}`);
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      } catch (e) {}
    }

    function getRankTitle(count) {
      if (count === 0) return 'Чистый лист';
      if (count < 35) return 'Искатель сюжетов';
      if (count < 80) return 'Посвященный читатель';
      if (count < 130) return 'Знаток классики';
      if (count < 185) return 'Магистр полифонии';
      if (count < 230) return 'Покоритель модернизма';
      return 'Абсолютный Левиафан';
    }

    function updateDashboard() {
      const readCount = BOOKS.filter(b => state[b.id]?.read).length;
      const pct = Math.round((readCount / BOOKS.length) * 100);

      document.getElementById('total-count').textContent = readCount;
      document.getElementById('total-percent').textContent = `(${pct}%)`;
      document.getElementById('total-bar').style.width = `${pct}%`;
      document.getElementById('reader-rank').textContent = getRankTitle(readCount);
    }

    function renderTierTabs() {
      const container = document.getElementById('tier-tabs');
      const totalDone = BOOKS.filter(b => state[b.id]?.read).length;
      const allBtn = `
        <button onclick="setTier('ALL')" class="px-2 py-0.5 rounded text-[11px] font-semibold whitespace-nowrap transition ${
          activeTier === 'ALL' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }">Все (${totalDone}/${BOOKS.length})</button>
      `;
      const tierBtns = TIERS.map(t => {
        const tierBooks = BOOKS.filter(b => b.tier === t.id);
        const done = tierBooks.filter(b => state[b.id]?.read).length;
        return `
          <button onclick="setTier('${t.id}')" class="px-2 py-0.5 rounded text-[11px] font-semibold whitespace-nowrap transition ${
            activeTier === t.id ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }">${t.label} (${done}/${tierBooks.length})</button>
        `;
      }).join('');
      container.innerHTML = allBtn + tierBtns;
    }

    function setTier(tierId) {
      activeTier = tierId;
      renderTierTabs();
      renderBooks();
    }

    function toggleRead(id) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].read = !state[id].read;
      saveState();
      renderBooks();
    }

    function setRating(id, rating) {
      if (!state[id]) state[id] = { read: true, rating: 0, note: '', showRec: false };
      state[id].rating = state[id].rating === rating ? 0 : rating;
      if (state[id].rating > 0) state[id].read = true;
      saveState();
      renderBooks();
    }

    function updateNote(id, value) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].note = value;
      saveState();
    }

    function toggleRec(id) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].showRec = !state[id].showRec;
      renderBooks();
    }

    function renderBooks() {
      const statusFilter = document.getElementById('status-filter').value;
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const container = document.getElementById('books-container');

      const filtered = BOOKS.filter(b => {
        if (activeTier !== 'ALL' && b.tier !== activeTier) return false;
        const isRead = !!state[b.id]?.read;
        if (statusFilter === 'read' && !isRead) return false;
        if (statusFilter === 'unread' && isRead) return false;
        if (query) {
          const hay = `${b.title} ${b.author} ${b.country} ${b.feature}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-6 bg-white border border-slate-200 rounded-xl text-slate-400 text-xs">
            По вашему фильтру книг не найдено.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(b => {
        const item = state[b.id] || { read: false, rating: 0, note: '', showRec: false };
        const tierObj = TIERS.find(t => t.id === b.tier);

        const starsHtml = [1, 2, 3, 4, 5].map(star => `
          <button onclick="setRating('${b.id}', ${star})" class="text-[11px] transition ${
            star <= (item.rating || 0) ? 'text-amber-500' : 'text-slate-300 hover:text-slate-400'
          }" title="Оценить на ${star}">★</button>
        `).join('');

        const recButtonHtml = b.rec ? `
          <button onclick="toggleRec('${b.id}')" class="text-[10px] px-1.5 py-0.2 rounded border border-amber-300 bg-amber-50 text-amber-800 font-medium hover:bg-amber-100 transition">
            💡 База
          </button>
        ` : '';

        const recPopupHtml = (b.rec && item.showRec) ? `
          <div class="mt-1.5 p-2 bg-amber-50/90 border border-amber-200 rounded-lg text-[11px] text-amber-950 leading-snug">
            <div class="font-semibold flex items-center justify-between">
              <span>Прочитать до:</span>
              <button onclick="toggleRec('${b.id}')" class="text-amber-700 hover:text-black px-1">✕</button>
            </div>
            <div class="mt-0.5">${b.rec}</div>
          </div>
        ` : '';

        return `
          <div class="rounded-xl border transition-all p-2.5 flex flex-col justify-between ${
            item.read ? 'bg-amber-50/40 border-amber-300' : 'bg-white border-slate-200 hover:border-slate-300'
          }">
            <div>
              <div class="flex items-start justify-between gap-1.5">
                <label class="flex items-start gap-2 cursor-pointer select-none flex-1 min-w-0">
                  <input type="checkbox" ${item.read ? 'checked' : ''} onchange="toggleRead('${b.id}')"
                    class="mt-0.5 w-3.5 h-3.5 rounded accent-amber-600 cursor-pointer shrink-0" />
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1 flex-wrap">
                      <span class="px-1 py-0.2 text-[9px] font-semibold rounded border ${tierObj.badge}">${b.tier}</span>
                      <span class="text-[10px] text-slate-400 truncate">${b.country}</span>
                    </div>
                    <h3 class="text-xs font-bold leading-snug mt-0.5 ${item.read ? 'line-through text-slate-400' : 'text-slate-900'}">
                      ${b.title}
                    </h3>
                    <p class="text-[11px] font-medium text-amber-700 truncate">${b.author}</p>
                  </div>
                </label>
                <div class="flex flex-col items-end gap-1 shrink-0">
                  <div class="flex items-center gap-0.5">${starsHtml}</div>
                  ${recButtonHtml}
                </div>
              </div>
              <p class="text-[10px] text-slate-500 mt-1 pl-5 leading-snug">${b.feature}</p>
              ${recPopupHtml}
            </div>

            <div class="mt-1.5 pl-5">
              <input type="text" value="${(item.note || '').replace(/"/g, '&quot;')}"
                oninput="updateNote('${b.id}', this.value)"
                placeholder="Заметка..."
                class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-0.5 text-[10px] text-slate-700 placeholder-slate-400 focus:outline-none focus:border-amber-600" />
            </div>
          </div>
        `;
      }).join('');
    }

    function copyShareLink() {
      const code = encodeProgressCode();
      const baseUrl = window.location.href.split('?')[0].split('#')[0];
      const shareUrl = code ? `${baseUrl}?p=${code}` : baseUrl;
      const isSandbox = baseUrl.startsWith('about:') || baseUrl.startsWith('blob:') || baseUrl.startsWith('data:');
      const textToCopy = isSandbox ? `Код прогресса: ${code || '0'}` : shareUrl;

      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast(isSandbox ? 'Код скопирован!' : 'Ссылка скопирована!');
      });
    }

    function exportTextSummary() {
      const readBooks = BOOKS.filter(b => state[b.id]?.read);
      const rank = getRankTitle(readBooks.length);
      let lines = [
        `📚 Литературный вызов: ${readBooks.length} / ${BOOKS.length} (${Math.round((readBooks.length / BOOKS.length) * 100)}%)`,
        `🏆 Ранг: ${rank}`,
        ``
      ];

      TIERS.forEach(t => {
        const tierBooks = BOOKS.filter(b => b.tier === t.id);
        const done = tierBooks.filter(b => state[b.id]?.read);
        lines.push(`${t.label}: ${done.length}/${tierBooks.length}`);
        done.forEach(b => {
          const stars = state[b.id]?.rating ? ` (${'★'.repeat(state[b.id].rating)})` : '';
          lines.push(`  ✅ ${b.title} — ${b.author}${stars}`);
        });
      });

      const code = encodeProgressCode();
      if (code) lines.push(``, `🔑 Код: ${code}`);

      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        showToast('Отчет скопирован!');
      });
    }

    function openImportModal() {
      document.getElementById('import-input').value = '';
      document.getElementById('import-modal').classList.remove('hidden');
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }

    function applyImportCode() {
      const val = document.getElementById('import-input').value;
      const decoded = decodeProgressCode(val);
      if (!decoded) {
        showToast('Не удалось распознать код');
        return;
      }
      state = decoded;
      isViewingShared = true;
      document.getElementById('shared-banner').classList.remove('hidden');
      closeImportModal();
      updateDashboard();
      renderTierTabs();
      renderBooks();
      showToast('Список загружен!');
    }

    function acceptSharedProgress() {
      saveState();
      showToast('Сохранено как ваш список!');
    }

    function resetToOwnProgress() {
      const saved = localStorage.getItem(STORAGE_KEY);
      state = saved ? JSON.parse(saved) : {};
      isViewingShared = false;
      document.getElementById('shared-banner').classList.add('hidden');
      history.replaceState(null, '', window.location.pathname);
      updateDashboard();
      renderTierTabs();
      renderBooks();
      showToast('Возвращен ваш список');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.add('hidden'), 2800);
    }

    init();
  </script>
