<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Литературный вызов: 200 книг мирового канона</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #e2e8f0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen pb-16 selection:bg-amber-200 selection:text-slate-900">

  <!-- Уведомление -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-slate-900 text-white font-semibold px-4 py-2 rounded-xl shadow-xl text-xs flex items-center gap-2">
    <span id="toast-text">Скопировано!</span>
  </div>

  <!-- Модальное окно импорта -->
  <div id="import-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-900 mb-1">Загрузить чужой прогресс</h3>
      <p class="text-xs text-slate-500 mb-3">Вставьте ссылку или код прогресса:</p>
      <input id="import-input" type="text" placeholder="Ссылка или код..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-amber-600 mb-4" />
      <div class="flex justify-end gap-2">
        <button onclick="closeImportModal()" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100">Отмена</button>
        <button onclick="applyImportCode()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-600 text-white hover:bg-amber-700">Применить</button>
      </div>
    </div>
  </div>

  <!-- Баннер чужого прогресса -->
  <div id="shared-banner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-2">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <span class="text-amber-800 text-xs font-medium">👀 Просмотр чужого прогресса. Любое изменение сохранит его как ваш собственный.</span>
      <div class="flex items-center gap-2">
        <button onclick="acceptSharedProgress()" class="px-2.5 py-1 bg-amber-600 text-white font-semibold rounded-lg text-xs hover:bg-amber-700">Сохранить</button>
        <button onclick="resetToOwnProgress()" class="px-2.5 py-1 bg-slate-200 text-slate-700 font-medium rounded-lg text-xs hover:bg-slate-300">Вернуть мой</button>
      </div>
    </div>
  </div>

  <!-- Компактная шапка -->
  <header class="border-b border-slate-200 bg-white/95 backdrop-blur sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-3 py-2">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0">
          <h1 class="serif-title text-base sm:text-lg font-bold text-slate-900 truncate">Литературный вызов: 200 книг</h1>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="copyShareLink()" class="px-2.5 py-1 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-semibold text-xs transition">🔗 Ссылка</button>
          <button onclick="exportTextSummary()" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs border border-slate-200 transition">📋 Текст</button>
          <button onclick="openImportModal()" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium text-xs border border-slate-200 transition">📥</button>
        </div>
      </div>

      <!-- Мини-прогресс -->
      <div class="mt-1.5 flex items-center justify-between gap-3 text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1">
        <div class="flex items-center gap-2 truncate">
          <span id="reader-rank" class="font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded text-[10px] truncate">Искатель</span>
          <span class="text-slate-500 hidden sm:inline">Прочитано:</span>
          <span class="font-semibold text-slate-800"><span id="total-count">0</span> / <span id="total-max">200</span> (<span id="total-percent">0%</span>)</span>
        </div>
        <div class="w-28 sm:w-44 h-1.5 bg-slate-200 rounded-full overflow-hidden shrink-0">
          <div id="total-bar" class="h-full bg-amber-600 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Панель фильтров -->
  <section class="max-w-6xl mx-auto px-3 pt-3">
    <div class="flex flex-col gap-2">
      <!-- Табы уровней -->
      <div id="tier-tabs" class="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1"></div>

      <!-- Поиск и фильтр статуса -->
      <div class="flex items-center gap-2">
        <select id="status-filter" onchange="renderBooks()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-700 focus:outline-none focus:border-amber-600 shadow-xs">
          <option value="all">Все (200)</option>
          <option value="unread">Не прочитано</option>
          <option value="read">Прочитано</option>
        </select>
        <input id="search-input" oninput="renderBooks()" type="text" placeholder="Поиск по названию или автору..." class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-600 shadow-xs" />
      </div>
    </div>
  </section>

  <!-- Сетка книг -->
  <main class="max-w-6xl mx-auto px-3 mt-3">
    <div id="books-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
  </main>

    const STORAGE_KEY = 'lit_canon_200_v2';
    let state = {};
    let activeTier = 'ALL';
    let isViewingShared = false;

    function init() {
      document.getElementById('total-max').textContent = BOOKS.length;
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { state = JSON.parse(saved); } catch (e) { state = {}; }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const sharedCode = urlParams.get('p') || hashParams.get('p');

      if (sharedCode) {
        const decoded = decodeProgressCode(sharedCode);
        if (decoded) {
          state = decoded;
          isViewingShared = true;
          document.getElementById('shared-banner').classList.remove('hidden');
        }
      }

      renderTierTabs();
      updateDashboard();
      renderBooks();
    }

    function saveState() {
      if (isViewingShared) {
        isViewingShared = false;
        document.getElementById('shared-banner').classList.add('hidden');
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateUrlHashSilently();
      updateDashboard();
    }

    function encodeProgressCode() {
      const parts = [];
      BOOKS.forEach(b => {
        const item = state[b.id];
        if (item && item.read) {
          parts.push(item.rating ? `${b.id}.${item.rating}` : b.id);
        }
      });
      return parts.join('-');
    }

    function decodeProgressCode(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.trim();
      if (clean.includes('p=')) {
        const match = clean.match(/[?#&]p=([^&#\s]+)/);
        if (match && match[1]) clean = decodeURIComponent(match[1]);
      }
      const validIds = new Set(BOOKS.map(b => b.id));
      const newState = {};
      const tokens = clean.split(/[-,]/);
      let foundAny = false;

      tokens.forEach(tok => {
        const [id, ratingStr] = tok.trim().split('.');
        if (validIds.has(id)) {
          foundAny = true;
          const rating = parseInt(ratingStr, 10);
          newState[id] = {
            read: true,
            rating: (!isNaN(rating) && rating >= 1 && rating <= 5) ? rating : 0,
            note: '',
            showRec: false
          };
        }
      });
      return foundAny ? newState : null;
    }

    function updateUrlHashSilently() {
      const code = encodeProgressCode();
      try {
        if (code) {
          history.replaceState(null, '', `#p=${code}`);
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      } catch (e) {}
    }

    function getRankTitle(count) {
      const total = BOOKS.length;
      if (count === 0) return `Чистый лист (0/${total})`;
      if (count < 30) return 'Искатель сюжетов';
      if (count < 70) return 'Посвященный читатель';
      if (count < 110) return 'Знаток классики';
      if (count < 150) return 'Магистр полифонии';
      if (count < 190) return 'Покоритель модернизма';
      return `Деконструктор реальности (${total}/${total})`;
    }

    function updateDashboard() {
      const readCount = BOOKS.filter(b => state[b.id]?.read).length;
      const pct = Math.round((readCount / BOOKS.length) * 100);

      document.getElementById('total-count').textContent = readCount;
      document.getElementById('total-percent').textContent = `${pct}%`;
      document.getElementById('total-bar').style.width = `${pct}%`;
      document.getElementById('reader-rank').textContent = getRankTitle(readCount);
    }

    function renderTierTabs() {
      const container = document.getElementById('tier-tabs');
      const allBtn = `
        <button onclick="setTier('ALL')" class="px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
          activeTier === 'ALL' ? 'bg-amber-600 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
        }">Все (${BOOKS.length})</button>
      `;
      const tierBtns = TIERS.map(t => {
        const count = BOOKS.filter(b => b.tier === t.id).length;
        return `
          <button onclick="setTier('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
            activeTier === t.id ? 'bg-amber-600 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
          }">${t.label} (${count})</button>
        `;
      }).join('');
      container.innerHTML = allBtn + tierBtns;
    }

    function setTier(tierId) {
      activeTier = tierId;
      renderTierTabs();
      renderBooks();
    }

    function toggleRead(id) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].read = !state[id].read;
      saveState();
      renderBooks();
    }

    function setRating(id, rating) {
      if (!state[id]) state[id] = { read: true, rating: 0, note: '', showRec: false };
      state[id].rating = state[id].rating === rating ? 0 : rating;
      if (state[id].rating > 0) state[id].read = true;
      saveState();
      renderBooks();
    }

    function updateNote(id, value) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].note = value;
      saveState();
    }

    function toggleRec(id) {
      if (!state[id]) state[id] = { read: false, rating: 0, note: '', showRec: false };
      state[id].showRec = !state[id].showRec;
      renderBooks();
    }

    function renderBooks() {
      const statusFilter = document.getElementById('status-filter').value;
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const container = document.getElementById('books-container');

      const filtered = BOOKS.filter(b => {
        if (activeTier !== 'ALL' && b.tier !== activeTier) return false;
        const isRead = !!state[b.id]?.read;
        if (statusFilter === 'read' && !isRead) return false;
        if (statusFilter === 'unread' && isRead) return false;
        if (query) {
          const hay = `${b.title} ${b.author} ${b.country} ${b.feature}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-8 bg-white border border-slate-200 rounded-xl text-slate-400 text-xs">
            По вашему фильтру книг не найдено.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(b => {
        const item = state[b.id] || { read: false, rating: 0, note: '', showRec: false };
        const tierObj = TIERS.find(t => t.id === b.tier);

        const starsHtml = [1, 2, 3, 4, 5].map(star => `
          <button onclick="setRating('${b.id}', ${star})" class="text-xs transition transform hover:scale-110 ${
            star <= (item.rating || 0) ? 'text-amber-500' : 'text-slate-300 hover:text-slate-400'
          }" title="Оценить на ${star}">★</button>
        `).join('');

        const recButtonHtml = b.rec ? `
          <button onclick="toggleRec('${b.id}')" class="text-[10px] px-2 py-0.5 rounded border border-amber-300 bg-amber-50 text-amber-800 font-medium hover:bg-amber-100 transition flex items-center gap-1">
            <span>💡 С чего начать?</span>
          </button>
        ` : '';

        const recPopupHtml = (b.rec && item.showRec) ? `
          <div class="mt-2 p-2.5 bg-amber-50/90 border border-amber-200 rounded-lg text-[11px] text-amber-900 leading-snug">
            <div class="font-semibold mb-0.5 flex items-center justify-between">
              <span>Рекомендации перед чтением:</span>
              <button onclick="toggleRec('${b.id}')" class="text-amber-700 hover:text-black">✕</button>
            </div>
            ${b.rec}
          </div>
        ` : '';

        return `
          <div class="rounded-xl border transition-all p-2.5 flex flex-col justify-between shadow-xs ${
            item.read ? 'bg-amber-50/40 border-amber-300' : 'bg-white border-slate-200 hover:border-slate-300'
          }">
            <div>
              <div class="flex items-start justify-between gap-2">
                <label class="flex items-start gap-2 cursor-pointer select-none flex-1 min-w-0">
                  <input type="checkbox" ${item.read ? 'checked' : ''} onchange="toggleRead('${b.id}')"
                    class="mt-0.5 w-4 h-4 rounded text-amber-600 focus:ring-amber-500 cursor-pointer shrink-0" />
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 mb-0.5 flex-wrap">
                      <span class="px-1.5 py-0.5 text-[10px] font-semibold rounded border ${tierObj.badge}">${b.tier}</span>
                      <span class="text-[10px] text-slate-400">${b.country}</span>
                      ${recButtonHtml}
                    </div>
                    <h3 class="text-xs sm:text-sm font-bold leading-snug truncate ${item.read ? 'line-through text-slate-400' : 'text-slate-800'}">
                      ${b.title}
                    </h3>
                    <p class="text-[11px] font-medium text-amber-700 truncate">${b.author}</p>
                  </div>
                </label>
                <div class="flex items-center gap-0.5 shrink-0 pt-0.5">${starsHtml}</div>
              </div>
              <p class="text-[11px] text-slate-500 mt-1.5 pl-6 leading-relaxed">${b.feature}</p>
              ${recPopupHtml}
            </div>

            <div class="mt-2 pl-6">
              <input type="text" value="${(item.note || '').replace(/"/g, '&quot;')}"
                oninput="updateNote('${b.id}', this.value)"
                placeholder="Заметка..."
                class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-0.5 text-[11px] text-slate-700 placeholder-slate-400 focus:outline-none focus:border-amber-600" />
            </div>
          </div>
        `;
      }).join('');
    }

    function copyShareLink() {
      const code = encodeProgressCode();
      const baseUrl = window.location.href.split('?')[0].split('#')[0];
      const shareUrl = code ? `${baseUrl}?p=${code}` : baseUrl;
      const isSandbox = baseUrl.startsWith('about:') || baseUrl.startsWith('blob:') || baseUrl.startsWith('data:');
      const textToCopy = isSandbox ? `Код прогресса: ${code || 'пока 0'}` : shareUrl;

      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast(isSandbox ? 'Код прогресса скопирован!' : 'Ссылка скопирована!');
      });
    }

    function exportTextSummary() {
      const readBooks = BOOKS.filter(b => state[b.id]?.read);
      const rank = getRankTitle(readBooks.length);
      let lines = [`📚 Литературный вызов: ${readBooks.length} / ${BOOKS.length} (${Math.round((readBooks.length / BOOKS.length) * 100)}%)`, `🏆 Ранг: ${rank}`, ``];

      TIERS.forEach(t => {
        const tierBooks = BOOKS.filter(b => b.tier === t.id);
        const done = tierBooks.filter(b => state[b.id]?.read);
        lines.push(`${t.label}: ${done.length}/${tierBooks.length}`);
        done.forEach(b => {
          const stars = state[b.id]?.rating ? ` (${'★'.repeat(state[b.id].rating)})` : '';
          lines.push(`  ✅ ${b.title} — ${b.author}${stars}`);
        });
      });

      const code = encodeProgressCode();
      if (code) lines.push(``, `🔑 Код: ${code}`);

      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        showToast('Текстовая сводка скопирована!');
      });
    }

    function openImportModal() {
      document.getElementById('import-input').value = '';
      document.getElementById('import-modal').classList.remove('hidden');
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }

    function applyImportCode() {
      const val = document.getElementById('import-input').value;
      const decoded = decodeProgressCode(val);
      if (!decoded) {
        showToast('Не удалось распознать код');
        return;
      }
      state = decoded;
      isViewingShared = true;
      document.getElementById('shared-banner').classList.remove('hidden');
      closeImportModal();
      updateDashboard();
      renderBooks();
      showToast('Прогресс загружен!');
    }

    function acceptSharedProgress() {
      saveState();
      showToast('Прогресс сохранен как ваш!');
    }

    function resetToOwnProgress() {
      const saved = localStorage.getItem(STORAGE_KEY);
      state = saved ? JSON.parse(saved) : {};
      isViewingShared = false;
      document.getElementById('shared-banner').classList.add('hidden');
      history.replaceState(null, '', window.location.pathname);
      updateDashboard();
      renderBooks();
      showToast('Возвращен ваш личный список');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    init();
  </script>
